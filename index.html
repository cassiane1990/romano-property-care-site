<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROMANO PROPERTY CARE</title>
</head>
<body>
<div style="font-family:Arial,sans-serif;padding:40px;text-align:center">Cargando ROMANO PROPERTY CARE…</div>
<script>
(async()=>{
  try{
    const base='site-payload/';
    const parts=await Promise.all(['1.txt','2.txt','3.txt','4.txt'].map(async f=>{
      const r=await fetch(base+f,{cache:'no-store'});
      if(!r.ok) throw new Error('No se pudo cargar '+f);
      return (await r.text()).trim();
    }));
    const b64=parts.join('');
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div style="font-family:Arial,sans-serif;padding:40px;text-align:center"><h2>ROMANO PROPERTY CARE</h2><p>No se pudo cargar el sitio. Recarga la página.</p></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
