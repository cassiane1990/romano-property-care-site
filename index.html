<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROMANO PROPERTY CARE</title></head><body><script>(async()=>{const b=await Promise.all([1,2,3,4].map(i=>fetch(`site-payload/${i}.txt`).then(r=>r.text())));const s=b.join(''),x=atob(s),u=new Uint8Array(x.length);for(let i=0;i<x.length;i++)u[i]=x.charCodeAt(i);const h=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(h);document.close()})().catch(e=>document.body.innerHTML='<p style="font-family:Arial;padding:30px">ROMANO PROPERTY CARE — carregando...</p>');</script></body></html>
